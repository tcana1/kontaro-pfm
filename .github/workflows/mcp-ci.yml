name: MCP CI

on:
  push:
    branches: [main]
    paths: ['mcp/**']
  pull_request:
    branches: [main]
    paths: ['mcp/**']
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mcp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mcp/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt ruff

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: python3 -m pytest -q
